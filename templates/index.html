<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixel Art Canvas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main>
      <h1>Pixel Art Canvas</h1>
      <div class="workspace">
        <section class="board-wrap" aria-label="Drawing area">
          <canvas id="pixel-grid" width="320" height="320" aria-label="32 by 32 pixel drawing grid"></canvas>
        </section>
        <aside class="controls">
          <h2>Draw</h2>
          <div class="palette" aria-label="Colour palette">
            <button class="swatch" type="button" data-color="#000000" aria-label="Black" aria-pressed="true" style="background:#000000"></button>
            <button class="swatch" type="button" data-color="#ffffff" aria-label="White" aria-pressed="false" style="background:#ffffff"></button>
            <button class="swatch" type="button" data-color="#e53935" aria-label="Red" aria-pressed="false" style="background:#e53935"></button>
            <button class="swatch" type="button" data-color="#fb8c00" aria-label="Orange" aria-pressed="false" style="background:#fb8c00"></button>
            <button class="swatch" type="button" data-color="#fdd835" aria-label="Yellow" aria-pressed="false" style="background:#fdd835"></button>
            <button class="swatch" type="button" data-color="#43a047" aria-label="Green" aria-pressed="false" style="background:#43a047"></button>
            <button class="swatch" type="button" data-color="#1e88e5" aria-label="Blue" aria-pressed="false" style="background:#1e88e5"></button>
            <button class="swatch" type="button" data-color="#8e24aa" aria-label="Purple" aria-pressed="false" style="background:#8e24aa"></button>
          </div>
          <form id="save-form">
            <label for="canvas-name">Canvas name
              <input id="canvas-name" name="name" maxlength="120" required autocomplete="off" placeholder="My pixel art">
            </label>
            <button type="submit">Save canvas</button>
          </form>
          <p id="status" role="status" aria-live="polite"></p>
        </aside>
      </div>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
